<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Valentine-Letter</title>
</head>

<body>
    <!-- ENVELOPE SCREEN -->
    <div id="envelope-container">
        <img src="graphics/envelope.png" alt="Envelope" id="envelope" />
        <p>💖Letter for you💖</p>
    </div>
        <!-- LETTER SCREEN -->
        <div id="letter-container">
            <div class="letter-window">
                <h1 id="letter-title">Will you be my Valentine</h1>
                <img src="graphics/cat_heart.gif" class="cat" id="letter-cat" />
                <div class="buttons" id="letter-button">
                    <img src="graphics/yes.png" alt="Yes" class="btn yes-btn" />

                    <div class="no-wrapper">
                        <img src="graphics/no.png" alt="No" class="btn no-btn" />
                    </div>
                </div>
                <p id="final-text" class="final-text" style="display: none;">
                    <strong>Valentine Date:</strong>Meaow restaurant at 7pm. Dress Fancy.
                </p>
            </div>
        </div>
        <!-- END OF LETTER SCREEN -->
    <script src="script.js"></script>
</body>

</html>
